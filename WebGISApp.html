<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>MrKhatibian</title>
    <style>
        html,
        body,
        #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }
    </style>

    <link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.33/"></script>    
</head>

<body>
    <div id="viewDiv"></div>
    <script type="module">
        const [Map, MapView,
            Home, ScaleBar, Compass, BasemapGallery, Expand]
            = await $arcgis.import([
            "@arcgis/core/Map.js",
            "@arcgis/core/views/MapView.js",

            "@arcgis/core/widgets/Home.js",
            "@arcgis/core/widgets/ScaleBar.js",
            "@arcgis/core/widgets/Compass.js",
            "@arcgis/core/widgets/BasemapGallery.js",
            "@arcgis/core/widgets/Expand.js",

        ]);

        const map = new Map({
            basemap: "topo",
        });

        const view = new MapView({
            container: "viewDiv",
            map: map,
            zoom: 6,
            center: [5, 50], // longitude, latitude
        });
        await view.when();

        const home = new Home({ view });
        view.ui.add(home, "top-left");

        const scalebar = new ScaleBar({ view });
        view.ui.add(scalebar, "bottom-right");   

        const compass = new Compass({ view });
        view.ui.add(compass, "top-right");

        const basemapgallery = new BasemapGallery({ view });

        const basemapExpand = new Expand({
            view,
            content: basemapgallery,
            expandIcon: "basemap",
            expandTooltip: "Change basemap",
            group: "top-right",
        });
        view.ui.add(basemapExpand, "bottom-left");
    </script>
</body>
</html>
